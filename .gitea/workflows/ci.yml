name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: linux
    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          poetry lock
          poetry install --with dev --no-interaction

      - name: Lint
        run: poetry run ruff check . || true

      - name: Test
        run: poetry run pytest -x -q --ignore=tests/e2e --ignore=tests/live -m "not live"
